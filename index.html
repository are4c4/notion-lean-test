<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lean Code Viewer</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f5;
      --panel: #ffffff;
      --border: #e5e5e0;
      --text: #2f3437;
      --muted: #787774;
      --code-bg: #f3f3f2;
      --keyword: #7c3aed;
      --command: #2563eb;
      --type: #b45309;
      --comment: #6b7280;
      --string: #047857;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #191919;
        --panel: #202020;
        --border: #343434;
        --text: #e6e6e6;
        --muted: #a0a0a0;
        --code-bg: #252525;
        --keyword: #c4b5fd;
        --command: #93c5fd;
        --type: #fcd34d;
        --comment: #9ca3af;
        --string: #6ee7b7;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .viewer {
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: var(--panel);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .filename {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    button, a.button {
      appearance: none;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--panel);
      color: var(--text);
      padding: 6px 9px;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
    }

    button:hover, a.button:hover { background: var(--code-bg); }

    .code-wrap {
      overflow: auto;
      background: var(--code-bg);
    }

    table {
      border-collapse: collapse;
      width: 100%;
    }

    td {
      vertical-align: top;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      line-height: 1.55;
    }

    td.line-no {
      user-select: none;
      width: 1%;
      min-width: 42px;
      padding: 10px 10px 10px 12px;
      text-align: right;
      color: var(--muted);
      border-right: 1px solid var(--border);
    }

    td.code-line {
      padding: 10px 14px;
      white-space: pre;
    }

    .kw { color: var(--keyword); font-weight: 600; }
    .cmd { color: var(--command); font-weight: 600; }
    .type { color: var(--type); }
    .comment { color: var(--comment); font-style: italic; }
    .string { color: var(--string); }

    .error {
      padding: 16px;
      color: #d14343;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="viewer">
    <div class="toolbar">
      <div id="filename" class="filename">Loading…</div>
      <div class="actions">
        <button id="copyBtn" type="button">Copy</button>
        <a id="githubBtn" class="button" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
      </div>
    </div>
    <div id="codeWrap" class="code-wrap"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const file = params.get('file') || 'sample.lean';
    const decl = params.get('decl');

    const codeWrap = document.getElementById('codeWrap');
    const filenameEl = document.getElementById('filename');
    const copyBtn = document.getElementById('copyBtn');
    const githubBtn = document.getElementById('githubBtn');

    let displayedCode = '';
    let startLineNumber = 1;

    filenameEl.textContent = decl ? `${file} — ${decl}` : file;
    githubBtn.href = `https://github.com/are4c4/notion-lean-test/blob/main/${file}`;

    function escapeHtml(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function highlightLean(line) {
      let html = escapeHtml(line);

      const commentIndex = html.indexOf('--');
      let codePart = commentIndex >= 0 ? html.slice(0, commentIndex) : html;
      const commentPart = commentIndex >= 0 ? html.slice(commentIndex) : '';

      codePart = codePart.replace(/(&quot;.*?&quot;|&apos;.*?&apos;)/g, '<span class="string">$1</span>');
      codePart = codePart.replace(/\b(theorem|lemma|example|def|abbrev|structure|class|instance|namespace|section|end|variable|variables|universe|open|export|noncomputable|private|protected|mutual|where|deriving|inductive|coinductive)\b/g, '<span class="kw">$1</span>');
      codePart = codePart.replace(/\b(import|by|simp|simpa|rw|rfl|exact|apply|intro|intros|constructor|cases|induction|have|show|calc|refine|aesop|omega|linarith|norm_num|ring|field_simp|positivity|decide)\b/g, '<span class="cmd">$1</span>');
      codePart = codePart.replace(/\b(Type|Prop|Nat|Int|Rat|Real|Complex|Fin|Set|Field|Ring|Group|Monoid|AddGroup|CommRing|IntegralDomain)\b/g, '<span class="type">$1</span>');

      if (commentPart) {
        codePart += `<span class="comment">${commentPart}</span>`;
      }

      return codePart;
    }

    function extractDeclaration(source, name) {
      const lines = source.split('\n');
      const declarationPattern = /^\s*(?:theorem|lemma|example|def|abbrev|instance|structure|class|inductive)\s+([^\s(:{]+)/;
      let start = -1;

      for (let i = 0; i < lines.length; i++) {
        const match = lines[i].match(declarationPattern);
        if (match && match[1] === name) {
          start = i;
          break;
        }
      }

      if (start === -1) {
        throw new Error(`Declaration "${name}" was not found in ${file}.`);
      }

      let end = lines.length;
      for (let i = start + 1; i < lines.length; i++) {
        const match = lines[i].match(declarationPattern);
        if (match) {
          end = i;
          break;
        }
      }

      while (end > start && lines[end - 1].trim() === '') {
        end--;
      }

      return {
        code: lines.slice(start, end).join('\n'),
        startLine: start + 1
      };
    }

    function renderCode(code, firstLine = 1) {
      displayedCode = code;
      startLineNumber = firstLine;
      const lines = code.split('\n');
      const rows = lines.map((line, index) => `
        <tr>
          <td class="line-no">${firstLine + index}</td>
          <td class="code-line">${highlightLean(line) || '&nbsp;'}</td>
        </tr>
      `).join('');

      codeWrap.innerHTML = `<table><tbody>${rows}</tbody></table>`;
    }

    fetch(`./${file}`)
      .then(response => {
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        return response.text();
      })
      .then(source => {
        if (decl) {
          const result = extractDeclaration(source, decl);
          renderCode(result.code, result.startLine);
        } else {
          renderCode(source, 1);
        }
      })
      .catch(error => {
        codeWrap.innerHTML = `<div class="error">${escapeHtml(String(error))}</div>`;
      });

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(displayedCode);
        const original = copyBtn.textContent;
        copyBtn.textContent = 'Copied!';
        setTimeout(() => copyBtn.textContent = original, 1200);
      } catch {
        copyBtn.textContent = 'Copy failed';
      }
    });
  </script>
</body>
</html>
